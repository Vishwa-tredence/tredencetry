name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - prod
      - qa
      - feature/*

jobs:
  deploy-to-databricks:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Verify Databricks connection
        run: databricks workspace list || echo "Connection test completed"

      - name: Deploy Notebooks / Jobs
        run: |
          databricks workspace import_dir /Workspace/Users/vishwa.dharshenee@tredence.com/tredencetry/notebooks-o
          databricks jobs create --json-file job-config.json
      - name: Deploy Notebooks / Jobs
        id: create_job
        run: |
         job_id=$(databricks jobs create --json-file job-config.json | jq -r '.job_id')
         echo "job_id=$job_id" >> $GITHUB_OUTPUT

      - name: Trigger Databricks Job Run
        run: |
         databricks jobs run-now --job-id ${{ steps.create_job.outputs.job_id }}


