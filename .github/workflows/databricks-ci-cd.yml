name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod
      - feature/*

jobs:
  deploy-to-databricks:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      # Step 1: Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install new Databricks CLI (v0.200+)
        run: |
          echo "Installing new Databricks CLI..."
          curl -fsSL https://databricks-dev-tools.s3.us-west-2.amazonaws.com/install.sh | bash
          export PATH=$PATH:/usr/local/bin
          databricks version

      # Step 4: Upload notebooks
      - name: Upload notebooks to Databricks
        run: |
          echo "Importing notebooks to Databricks workspace..."
          databricks workspace import-dir \
            --source ./notebooks \
            --target /Workspace/Users/vishwa.dharshenee@tredence.com/tredencetry/notebooks \
            --overwrite

      # Step 5: Create or update Databricks job
      - name: Create or update Databricks job
        id: deploy_job
        run: |
          echo "Creating or updating Databricks job..."
          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name=="Tredence-Job") | .job_id' || true)
          if [ -n "$JOB_ID" ]; then
            echo "Job already exists with ID: $JOB_ID"
            databricks jobs reset --job-id "$JOB_ID" --json-file job-config.json
          else
            echo "Creating new job..."
            JOB_ID=$(databricks jobs create --json-file job-config.json | jq -r '.job_id')
          fi
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      # Step 6: Trigger the job
      - name: Trigger Databricks job run
        run: |
          echo "Triggering Databricks job run for JOB_ID=${{ env.JOB_ID }}"
          databricks jobs run-now --job-id "${{ env.JOB_ID }}"

