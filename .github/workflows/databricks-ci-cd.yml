name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - qa
      - prod
      - feature/*

jobs:
  deploy-to-databricks:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install and configure Databricks CLI (v2)
      - name: Install and configure Databricks CLI
        run: |
          echo "Installing and configuring Databricks CLI..."
          python3 -m pip install --quiet --upgrade pip
          pip install --quiet --upgrade databricks jq
          export PATH="$PATH:$(python3 -m site --user-base)/bin"
          echo "✅ Databricks CLI version:"
          databricks --version
          echo "✅ Authentication test:"
          databricks workspace ls /
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Step 4: Create or update Databricks Job
      - name: Create or update Databricks Job
        id: deploy_job
        run: |
          echo "Checking if Databricks job already exists..."
          export PATH="$PATH:$(python3 -m site --user-base)/bin"

          JOB_ID=$(databricks jobs list --output json | jq -r '.jobs[] | select(.settings.name=="Tredence-Job") | .job_id' || true)

          if [ -n "$JOB_ID" ]; then
            echo "✅ Job already exists with ID: $JOB_ID"
            databricks jobs reset --job-id "$JOB_ID" --json-file job-config.json
          else
            echo "🆕 Creating a new Databricks job..."
            JOB_ID=$(databricks jobs create --json-file job-config.json | jq -r '.job_id')
          fi

          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

      # Step 5: Trigger the Databricks Job Run
      - name: Trigger Databricks Job Run
        run: |
          export PATH="$PATH:$(python3 -m site --user-base)/bin"
          echo "🚀 Triggering Databricks job run for JOB_ID=${{ env.JOB_ID }}"
          databricks jobs run-now --job-id "${{ env.JOB_ID }}"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

