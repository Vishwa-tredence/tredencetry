resources:
  jobs:
    cicd_try_jobs:
      name: cicd_try_jobs
      tasks:
        - task_key: bronze_job
          notebook_task:
            notebook_path: /Workspace/Users/vishwa.dharshenee@tredence.com/tredencetry/notebooks/bronze/ingestion_notebook
            source: WORKSPACE
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "serverless"
            num_workers: 1
            data_security_mode: SINGLE_USER

        - task_key: silver_job
          depends_on:
            - task_key: bronze_job
          notebook_task:
            notebook_path: /Workspace/Users/vishwa.dharshenee@tredence.com/tredencetry/notebooks/silver/silver_notebook
            source: WORKSPACE
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "serverless"
            num_workers: 1
            data_security_mode: SINGLE_USER

        - task_key: gold_job
          depends_on:
            - task_key: silver_job
          notebook_task:
            notebook_path: /Workspace/Users/vishwa.dharshenee@tredence.com/tredencetry/notebooks/gold/gold_notebook
            source: WORKSPACE
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "serverless"
            num_workers: 1
            data_security_mode: SINGLE_USER

      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
